<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Results — ŚREṢṬHA Contest 2026</title>
<link rel="icon" type="image/png" href="images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --saffron:     #F06A1B;
  --saffron-dim: #C45510;
  --gold:        #D4A843;
  --radius:      14px;
  --radius-sm:   8px;
}
:root {
  --bg:          #FDFAF4;
  --text:        #1A1208;
  --text-muted:  #6B5340;
  --border:      rgba(180,130,60,0.18);
  --card-bg:     #FFFFFF;
  --footer-bg:   #1A1208;
  --footer-text: #F0E8D8;
  --footer-muted:#9A8A72;
  --saffron-glow:rgba(240,106,27,0.10);
  --gold-light:  rgba(212,168,67,0.10);
  --error:       #C0392B;
  --error-glow:  rgba(192,57,43,0.08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:         #0E0A05;
    --text:       #F0E8D8;
    --text-muted: #9A8A72;
    --border:     rgba(212,168,67,0.15);
    --card-bg:    #231A0D;
    --saffron-glow:rgba(240,106,27,0.18);
    --gold-light:  rgba(212,168,67,0.12);
  }
}

html { scroll-behavior: smooth; font-size: calc(16px + 2pt); }
body {
  font-family: 'Inter', sans-serif;
  background: var(--bg); color: var(--text);
  line-height: 1.7; min-height: 100vh;
  display: flex; flex-direction: column;
}

/* NAV */
nav {
  background: var(--bg); border-bottom: 1px solid var(--border);
  padding: 0 2rem;
}
.nav-inner {
  max-width: 1120px; margin: 0 auto;
  display: flex; align-items: center; height: 66px; gap: 12px;
}
.nav-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
.nav-logo img { width: 38px; height: 38px; object-fit: contain; border-radius: 6px; }
.nav-logo-text {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.1rem; font-weight: 600; color: var(--text);
}

/* MAIN */
main {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  padding: 3rem 1.5rem; gap: 2rem;
}

.lookup-card {
  background: var(--card-bg); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 2.5rem;
  max-width: 480px; width: 100%; text-align: center;
}
.lookup-card h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(1.6rem, 4vw, 2.1rem); font-weight: 600;
  margin-bottom: 0.5rem;
}
.lookup-card .subtitle {
  font-size: 0.9rem; color: var(--text-muted); margin-bottom: 1.75rem;
}

.phone-form { display: flex; gap: 0.6rem; }
.phone-form input {
  flex: 1; padding: 0.8rem 1rem; border-radius: 100px;
  border: 1px solid var(--border); background: var(--bg); color: var(--text);
  font-size: 0.95rem; font-family: 'Inter', sans-serif;
}
.phone-form input:focus { outline: none; border-color: var(--saffron); }
.btn-primary {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--saffron); color: #fff; border: none; cursor: pointer;
  padding: 0.8rem 1.6rem; border-radius: 100px;
  font-weight: 700; font-size: 0.88rem;
  text-decoration: none; transition: background 0.2s, transform 0.15s;
  white-space: nowrap;
}
.btn-primary:hover { background: var(--saffron-dim); transform: translateY(-2px); }
.btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

.status-msg {
  margin-top: 1.25rem; font-size: 0.85rem; color: var(--text-muted);
}
.status-msg.error { color: var(--error); }

/* RESULTS */
.results-wrap { width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: 1rem; }
.result-card {
  background: var(--card-bg); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.5rem 1.75rem;
  display: flex; align-items: center; justify-content: space-between;
  gap: 1rem; flex-wrap: wrap;
}
.result-info h3 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.3rem; font-weight: 600; margin-bottom: 0.2rem;
}
.result-info .form-label {
  display: inline-block; font-size: 0.72rem; font-weight: 700;
  letter-spacing: 0.06em; text-transform: uppercase; color: var(--saffron);
  background: var(--saffron-glow); padding: 0.2rem 0.6rem; border-radius: 100px;
  margin-bottom: 0.4rem;
}
.result-info p { font-size: 0.85rem; color: var(--text-muted); }
.result-info .score { color: var(--text); font-weight: 600; }
.btn-download {
  display: inline-flex; align-items: center; justify-content: center;
  background: transparent; color: var(--text); cursor: pointer;
  padding: 0.7rem 1.3rem; border-radius: 100px;
  font-weight: 600; font-size: 0.85rem;
  border: 1px solid var(--border); transition: border-color 0.2s, background 0.2s;
  white-space: nowrap;
}
.btn-download:hover { border-color: var(--saffron); background: var(--saffron-glow); }

/* FOOTER */
footer {
  background: var(--footer-bg); border-top: 1px solid rgba(212,168,67,0.15);
  padding: 2rem; text-align: center;
}
footer p { font-size: 0.78rem; color: var(--footer-muted); }
.footer-hk { font-style: italic; color: var(--gold); margin-bottom: 0.25rem; }

@media (max-width: 480px) {
  .phone-form { flex-direction: column; }
  .result-card { flex-direction: column; align-items: flex-start; }
  .btn-download { width: 100%; }
}
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">
      <picture>
        <source srcset="images/logo_white.png" media="(prefers-color-scheme: dark)" />
        <img src="images/logo_black.png" alt="ŚREṢṬHA Contest" width="78" height="78" onerror="this.style.display='none'" />
      </picture>
      <span class="nav-logo-text">ŚREṢṬHA Contest</span>
    </a>
  </div>
</nav>

<main>
  <div class="lookup-card">
    <h1>Check Your Results</h1>
    <p class="subtitle">Enter the phone number used during quiz submission. If you submitted more than one entry, all of them will show up below.</p>
    <form class="phone-form" id="lookupForm">
      <input type="tel" id="phoneInput" placeholder="10-digit phone number" inputmode="numeric" required>
      <button type="submit" class="btn-primary" id="searchBtn">Search</button>
    </form>
    <p class="status-msg" id="statusMsg"></p>
  </div>

  <div class="results-wrap" id="resultsWrap"></div>
</main>

<footer>
  <p class="footer-hk">Hare Krishna 🙏</p>
  <p>An initiative by ISKCON Abids, Hyderabad &nbsp;·&nbsp; © 2026 Srestha Contest</p>
</footer>

<script>
// Paste the Cloudflare Worker URL here after deploying cloudflare-worker/ (see its README comments)
const RESULTS_API_URL = 'https://srestha-results.aksahoo-919.workers.dev';

const form = document.getElementById('lookupForm');
const phoneInput = document.getElementById('phoneInput');
const searchBtn = document.getElementById('searchBtn');
const statusMsg = document.getElementById('statusMsg');
const resultsWrap = document.getElementById('resultsWrap');

form.addEventListener('submit', async function (e) {
  e.preventDefault();
  const phone = phoneInput.value.trim();
  resultsWrap.innerHTML = '';
  statusMsg.textContent = '';
  statusMsg.classList.remove('error');

  if (!/^\d{10}$/.test(phone.replace(/\D/g, ''))) {
    statusMsg.textContent = 'Please enter a valid 10-digit phone number.';
    statusMsg.classList.add('error');
    return;
  }

  if (RESULTS_API_URL.indexOf('PASTE_') === 0) {
    statusMsg.textContent = 'Results lookup is not configured yet. See cloudflare-worker/src/index.js for setup instructions.';
    statusMsg.classList.add('error');
    return;
  }

  searchBtn.disabled = true;
  statusMsg.textContent = 'Searching...';

  try {
    const res = await fetch(RESULTS_API_URL + '?phone=' + encodeURIComponent(phone));
    const data = await res.json();

    if (data.error) {
      statusMsg.textContent = data.error;
      statusMsg.classList.add('error');
      return;
    }

    const results = data.results || [];
    if (results.length === 0) {
      statusMsg.textContent = 'No submissions found for this phone number.';
      return;
    }

    statusMsg.textContent = results.length + ' submission(s) found.';
    results.forEach(function (entry, idx) { renderResultCard(entry, idx); });
  } catch (err) {
    statusMsg.textContent = 'Something went wrong while fetching results. Please try again later.';
    statusMsg.classList.add('error');
  } finally {
    searchBtn.disabled = false;
  }
});

function renderResultCard(entry, idx) {
  const card = document.createElement('div');
  card.className = 'result-card';
  card.innerHTML =
    '<div class="result-info">' +
      '<span class="form-label">' + escapeHtml(entry.form || '') + '</span>' +
      '<h3>' + escapeHtml(entry.name || 'Participant') + '</h3>' +
      '<p>Score: <span class="score">' + escapeHtml(String(entry.score != null ? entry.score : '—')) + '</span></p>' +
    '</div>' +
    '<button class="btn-download" data-name="' + escapeAttr(entry.name || '') + '">Download Certificate</button>';

  card.querySelector('.btn-download').addEventListener('click', function () {
    generateCertificate(entry);
  });
  resultsWrap.appendChild(card);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function escapeAttr(str) {
  return str.replace(/"/g, '&quot;');
}

// ── Certificate generation ────────────────────────────────────────────────
// Template: images/Srestha_Cert.png  (2000 × 1414 px)
// Name drawn in Alex Brush (maroon), description in Inter below the divider.

const CERT_W    = 2000;
const CERT_H    = 1414;
const CREAM_CX  = 1155;   // horizontal centre of the cream area
const NAME_CY   = 635;    // vertical centre for the name
const MAX_NAME_W = 1500;  // auto-shrink if name is wider than this
const BODY_Y    = 862;    // top of first description line
const LINE_GAP  = 72;

const DESCRIPTION = [
  'has successfully participated in the Śreṣṭha Contest 2026',
  'a reading and knowledge initiative by ISKCON Abids, Hyderabad,',
  'and has demonstrated commendable understanding and dedication.',
];

function loadImage(src) {
  return new Promise(function (resolve, reject) {
    const img = new Image();
    img.onload  = function () { resolve(img); };
    img.onerror = reject;
    img.src = src;
  });
}

async function generateCertificate(entry) {
  const btn = document.querySelector('[data-name="' + CSS.escape(entry.name) + '"]');
  if (btn) { btn.textContent = 'Generating…'; btn.disabled = true; }

  try {
    await document.fonts.load('160px "Alex Brush"');
    await document.fonts.load('400 46px "Inter"');

    const tmpl   = await loadImage('images/Srestha_Cert.png');
    const canvas = document.createElement('canvas');
    canvas.width  = CERT_W;
    canvas.height = CERT_H;
    const ctx = canvas.getContext('2d');

    ctx.drawImage(tmpl, 0, 0, CERT_W, CERT_H);

    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';

    // Name — Alex Brush, auto-scale down for long names
    let fontSize = 160;
    ctx.font = fontSize + 'px "Alex Brush"';
    while (ctx.measureText(entry.name || '').width > MAX_NAME_W && fontSize > 60) {
      fontSize -= 5;
      ctx.font = fontSize + 'px "Alex Brush"';
    }
    ctx.fillStyle = '#74131F';
    ctx.fillText(entry.name || 'Participant', CREAM_CX, NAME_CY);

    // Description — Inter regular, top-aligned lines
    ctx.textBaseline = 'top';
    ctx.font         = '400 46px "Inter"';
    ctx.fillStyle    = '#321E14';
    let y = BODY_Y;
    DESCRIPTION.forEach(function (line) {
      ctx.fillText(line, CREAM_CX, y);
      y += LINE_GAP;
    });

    // Download as PNG
    canvas.toBlob(function (blob) {
      const url = URL.createObjectURL(blob);
      const a   = document.createElement('a');
      const safe = (entry.name || 'certificate').replace(/[^a-z0-9]+/gi, '_');
      a.href     = url;
      a.download = 'Srestha_Certificate_' + safe + '.png';
      a.click();
      URL.revokeObjectURL(url);
    }, 'image/png');
  } finally {
    if (btn) { btn.textContent = 'Download Certificate'; btn.disabled = false; }
  }
}
</script>
</body>
</html>
