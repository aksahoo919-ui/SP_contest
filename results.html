<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Results — Value Education Contest 2027</title>
<link rel="icon" type="image/png" href="images/logo.png">
<script>document.documentElement.classList.add('js');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Antonio:wght@600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── Design tokens (shared with index.html) ── */
:root {
  --ivory: #FAF6EE; --ivory-deep: #F2EADB; --paper: #FFFFFF;
  --ink: #241A12; --ink-soft: #5C4B3B; --ink-faint: #8A7865; --on-dark: #F3EBDD; --on-dark-soft: #B7A893;
  --saffron: #E0611A; --saffron-deep: #B84D0F; --saffron-tint: rgba(224,97,26,0.08);
  --gold: #A68A4E; --gold-soft: #C9B27E; --wa: #178C47; --wa-deep: #11733A; --wa-tint: rgba(23,140,71,0.08);
  --error: #B03A2E;
  --rule: rgba(36,26,18,0.14); --rule-strong: rgba(36,26,18,0.28);
  --font-display: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --fs-xs: 0.72rem; --fs-sm: 0.86rem; --fs-lg: 1.12rem;
  --max: 1200px; --gutter: clamp(1.25rem, 4vw, 2.5rem); --radius: 2px; --nav-h: 72px;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --text-muted: var(--ink-soft);
}

/* ── Base ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 17px; }
body { font-family: var(--font-body); line-height: 1.65; color: var(--ink); background: var(--ivory); min-height: 100vh; display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }
img { max-width: 100%; display: block; }
:focus-visible { outline: 2px solid var(--saffron); outline-offset: 3px; }
.icon { width: 1.25rem; height: 1.25rem; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.eyebrow { display: inline-flex; align-items: center; gap: 0.75rem; font-size: var(--fs-xs); font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: var(--saffron-deep); margin-bottom: 1.25rem; }
.eyebrow::before { content: ''; width: 2rem; height: 1px; background: currentColor; }

/* ── Buttons ── */
.btn-primary, .btn-outline, .btn-download {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.6rem;
  padding: 0.95rem 1.5rem; border: 1px solid transparent; border-radius: var(--radius);
  font-family: var(--font-body); font-size: 0.76rem; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase;
  text-decoration: none; white-space: nowrap; cursor: pointer; transition: background-color 0.2s, color 0.2s, border-color 0.2s;
}
.btn-primary { background: var(--saffron-deep); color: #fff; }
.btn-primary:hover { background: #9C410C; }
.btn-primary:disabled, .btn-download:disabled { opacity: 0.55; cursor: not-allowed; }
.btn-outline, .btn-download { background: transparent; color: var(--ink); border-color: var(--rule-strong); }
.btn-outline:hover, .btn-download:hover { border-color: var(--ink); }

/* ── Nav ── */
nav { background: rgba(250,246,238,0.94); border-bottom: 1px solid var(--rule); }
.nav-inner { max-width: var(--max); margin: 0 auto; padding: 0 var(--gutter); height: var(--nav-h); display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
.nav-logo { display: flex; align-items: center; gap: 0.7rem; text-decoration: none; color: var(--ink); }
.nav-logo img { width: 46px; height: 46px; object-fit: contain; }
.nav-logo-text { font-family: var(--font-display); font-size: 1.3rem; font-weight: 600; line-height: 1; white-space: nowrap; }
.nav-home { display: inline-flex; align-items: center; gap: 0.45rem; font-size: 0.8rem; font-weight: 500; color: var(--ink-soft); text-decoration: none; }
.nav-home:hover { color: var(--ink); }
.nav-home .icon { width: 1rem; height: 1rem; }

/* ── Footer ── */
footer { background: #15100C; color: var(--on-dark-soft); }
.footer-inner { max-width: var(--max); margin: 0 auto; padding: 2rem var(--gutter); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.5rem 2rem; }
footer p { font-size: 0.8rem; }
.footer-hk { color: var(--gold-soft); }

/* ── Motion ── */
.js [data-reveal] { opacity: 0; transform: translateY(24px); transition: opacity 0.9s var(--ease-out), transform 0.9s var(--ease-out); transition-delay: calc(var(--i, 0) * 90ms); }
.js .loaded [data-reveal] { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) { .js [data-reveal] { opacity: 1; transform: none; transition: none; } }

/* ── Results lookup ── */
main { flex: 1; width: 100%; max-width: var(--max); margin: 0 auto; padding: clamp(3rem, 7vw, 5.5rem) var(--gutter) clamp(4rem, 8vw, 6rem); }
.lookup-card { display: grid; grid-template-columns: minmax(0, 6fr) minmax(0, 5fr); gap: 1.5rem clamp(2rem, 6vw, 5rem); align-items: end; padding-bottom: clamp(2.5rem, 5vw, 3.5rem); border-bottom: 1px solid var(--rule); }
.lookup-card .subtitle { margin-top: 1.25rem; font-size: var(--fs-lg); color: var(--ink-soft); max-width: 32em; }
.lookup-field label { display: block; margin-bottom: 0.5rem; font-size: var(--fs-xs); font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-soft); }
.phone-form { display: flex; gap: 0.6rem; }
.phone-form input {
  flex: 1; min-width: 0; padding: 0.9rem 1rem; border: 1px solid var(--rule-strong); border-radius: var(--radius);
  background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 1rem;
}
.phone-form input:focus { outline: none; border-color: var(--saffron); }
.status-msg { margin-top: 0.9rem; min-height: 1.4em; font-size: var(--fs-sm); color: var(--ink-soft); }
.status-msg.error { color: var(--error); }

/* ── Result rows (rendered by the script below) ── */
.results-wrap { margin-top: 0.5rem; }
.result-card { display: flex; align-items: center; justify-content: space-between; gap: 1rem 2rem; flex-wrap: wrap; padding: 1.6rem 0; border-bottom: 1px solid var(--rule); animation: rise 0.7s var(--ease-out) both; }
.result-info .form-label { display: block; margin-bottom: 0.35rem; font-size: var(--fs-xs); font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold); }
.result-info .form-label:empty { display: none; }
.result-info h3 { font-family: var(--font-display); font-size: clamp(1.6rem, 3vw, 2.1rem); font-weight: 500; line-height: 1.1; }
.result-info p { margin-top: 0.3rem; font-size: var(--fs-sm); color: var(--ink-soft); }
.result-info .score { font-family: var(--font-display); font-size: 1.35rem; font-weight: 600; color: var(--saffron-deep); font-variant-numeric: lining-nums; }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .result-card { animation: none; } }
@media (max-width: 800px) { .lookup-card { grid-template-columns: 1fr; } }
@media (max-width: 480px) {
  .phone-form { flex-direction: column; }
  .result-card { flex-direction: column; align-items: flex-start; }
  .btn-download { width: 100%; }
}

/* ── Display headings (shared with index.html): condensed caps, shimmer accents ── */
.page-title { font-family: 'Antonio', 'Oswald', 'Arial Narrow', Impact, sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em; line-height: 1.02; color: #2C1A12; font-size: clamp(3rem, 7.4vw, 5.8rem); }
.shimmer, .shimmer-split .w > span {
  background: linear-gradient(120deg, #D47A00 0%, #FF7200 35%, #FFD700 50%, #FF7200 65%, #D47A00 100%);
  background-size: 200% auto; -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: var(--saffron);
  filter: drop-shadow(0 2px 8px rgba(255,114,0,0.18));
  animation: shimmer 4s linear infinite;
}
.shimmer-split { background: none; filter: none; animation: none; -webkit-text-fill-color: currentColor; }
@keyframes shimmer { from { background-position: 0% center; } to { background-position: 200% center; } }
.split .w { display: inline-block; overflow: hidden; white-space: nowrap; vertical-align: top; padding: 0.1em 0.04em 0.12em; margin: -0.1em -0.04em -0.12em; }
.split .w > span { display: inline-block; }
.js .split .w > span { transform: translateY(120%); transition: transform 0.75s cubic-bezier(0.16, 1, 0.3, 1); transition-delay: calc(var(--i, 0) * 25ms); }
.js .split.is-in .w > span { transform: none; }
@media (prefers-reduced-motion: reduce) {
  .js .split .w > span { transform: none; transition: none; }
  .shimmer, .shimmer-split .w > span { animation: none; }
}
</style>
</head>
<body>

<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5"/><path d="m11 18-6-6 6-6"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
</svg>

<nav>
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">
      <img src="images/logo_black.png" alt="Value Education Contest" width="78" height="78" onerror="this.style.display='none'" />
      <span class="nav-logo-text">Value Education Contest</span>
    </a>
    <a href="index.html" class="nav-home"><svg class="icon"><use href="#i-arrow-left"/></svg>Home</a>
  </div>
</nav>

<main>
  <div class="lookup-card">
    <div>
      <p class="eyebrow">Results</p>
      <h1 class="page-title">Check Your <span class="shimmer">Results</span></h1>
      <p class="subtitle" data-reveal>Enter the phone number used during quiz submission. If you submitted more than one entry, all of them will show up below.</p>
    </div>
    <div class="lookup-field" data-reveal style="--i:1">
      <label for="phoneInput">Phone number</label>
      <form class="phone-form" id="lookupForm">
        <input type="tel" id="phoneInput" placeholder="10-digit phone number" inputmode="numeric" required>
        <button type="submit" class="btn-primary" id="searchBtn">Search</button>
      </form>
      <p class="status-msg" id="statusMsg" role="status"></p>
    </div>
  </div>

  <div class="results-wrap" id="resultsWrap"></div>
</main>

<footer>
  <div class="footer-inner">
    <p class="footer-hk">Hare Krishna 🙏</p>
    <p>An initiative by ISKCON Abids, Hyderabad &nbsp;·&nbsp; © 2026-27 Value Education Contest</p>
  </div>
</footer>

<script>
// Fade the page content up once it has loaded
function showMain() { document.querySelector('main').classList.add('loaded'); }
requestAnimationFrame(showMain);
setTimeout(showMain, 150);
</script>
<script>
// Paste the Cloudflare Worker URL here after deploying cloudflare-worker/ (see its README comments)
const RESULTS_API_URL = 'https://srestha-results.aksahoo-919.workers.dev';

const form = document.getElementById('lookupForm');
const phoneInput = document.getElementById('phoneInput');
const searchBtn = document.getElementById('searchBtn');
const statusMsg = document.getElementById('statusMsg');
const resultsWrap = document.getElementById('resultsWrap');

form.addEventListener('submit', async function (e) {
  e.preventDefault();
  const phone = phoneInput.value.trim();
  resultsWrap.innerHTML = '';
  statusMsg.textContent = '';
  statusMsg.classList.remove('error');

  if (!/^\d{10}$/.test(phone.replace(/\D/g, ''))) {
    statusMsg.textContent = 'Please enter a valid 10-digit phone number.';
    statusMsg.classList.add('error');
    return;
  }

  if (RESULTS_API_URL.indexOf('PASTE_') === 0) {
    statusMsg.textContent = 'Results lookup is not configured yet. See cloudflare-worker/src/index.js for setup instructions.';
    statusMsg.classList.add('error');
    return;
  }

  searchBtn.disabled = true;
  statusMsg.textContent = 'Searching...';

  try {
    const res = await fetch(RESULTS_API_URL + '?phone=' + encodeURIComponent(phone));
    const data = await res.json();

    if (data.error) {
      statusMsg.textContent = data.error;
      statusMsg.classList.add('error');
      return;
    }

    const results = dedupeByName(data.results || []);
    if (results.length === 0) {
      statusMsg.textContent = 'No submissions found for this phone number.';
      return;
    }

    statusMsg.textContent = results.length + ' submission(s) found.';
    results.forEach(function (entry, idx) { renderResultCard(entry, idx); });
  } catch (err) {
    statusMsg.textContent = 'Something went wrong while fetching results. Please try again later.';
    statusMsg.classList.add('error');
  } finally {
    searchBtn.disabled = false;
  }
});

// Pull the leading numeric value out of a score like "85%", "17/20" or "42".
// Unscored/blank entries sort below any scored entry.
function scoreValue(entry) {
  const m = String(entry && entry.score != null ? entry.score : '').match(/-?\d+(\.\d+)?/);
  return m ? parseFloat(m[0]) : -Infinity;
}

// Collapse duplicate submissions: for each participant name (case-insensitive)
// under the same phone number, keep only their highest-scoring entry.
function dedupeByName(entries) {
  const best = new Map();
  entries.forEach(function (entry) {
    const key = String(entry.name || '').trim().toLowerCase();
    const existing = best.get(key);
    if (!existing || scoreValue(entry) > scoreValue(existing)) {
      best.set(key, entry);
    }
  });
  return Array.from(best.values());
}

// Cap display score: 99 or 100 → shown as 98
function displayScore(score) {
  if (score == null) return '—';
  const s = String(score);
  const m = s.match(/^(\d+)(%?)$/);
  if (m) {
    const n = parseInt(m[1], 10);
    if (n >= 99) return '98' + m[2];
  }
  return s;
}

function renderResultCard(entry, idx) {
  const card = document.createElement('div');
  card.className = 'result-card';
  card.innerHTML =
    '<div class="result-info">' +
      '<span class="form-label">' + escapeHtml(entry.form || '') + '</span>' +
      '<h3>' + escapeHtml(entry.name || 'Participant') + '</h3>' +
      '<p>Score: <span class="score">' + escapeHtml(displayScore(entry.score)) + '</span></p>' +
    '</div>' +
    '<button class="btn-download" data-name="' + escapeAttr(entry.name || '') + '">Download Certificate</button>';

  card.querySelector('.btn-download').addEventListener('click', function () {
    generateCertificate(entry);
  });
  resultsWrap.appendChild(card);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function escapeAttr(str) {
  return str.replace(/"/g, '&quot;');
}

// ── Certificate generation ────────────────────────────────────────────────
// Template: images/Srestha_Certificate_1.png  — all wording is baked into the
// image; the only thing drawn on top is the participant's name (Alex Brush),
// centred in the blank line between "THIS IS TO CERTIFY THAT" and the divider.

const NAME_CX_FRAC = 0.615;  // horizontal centre of the certificate's text area
const NAME_CY_FRAC = 0.515;  // vertical centre of the blank name line
const NAME_MAX_FRAC = 0.60;  // name may occupy up to 60% of the image width
const NAME_SIZE_FRAC = 0.11; // starting font size relative to image height
const NAME_COLOR = '#1E2E6E'; // deep navy, matching the template

function loadImage(src) {
  return new Promise(function (resolve, reject) {
    const img = new Image();
    img.onload  = function () { resolve(img); };
    img.onerror = reject;
    img.src = src;
  });
}

// Capitalise the first letter of each word (e.g. "ankit kumar" -> "Ankit Kumar")
function titleCase(str) {
  return String(str || '').toLowerCase().replace(/\b\p{L}/gu, function (c) {
    return c.toUpperCase();
  });
}

async function generateCertificate(entry) {
  const btn = document.querySelector('[data-name="' + CSS.escape(entry.name) + '"]');
  if (btn) { btn.textContent = 'Generating…'; btn.disabled = true; }

  try {
    await document.fonts.load('160px "Alex Brush"');

    const tmpl   = await loadImage('images/Srestha_Certificate_1.png');
    const W = tmpl.naturalWidth;
    const H = tmpl.naturalHeight;

    const canvas = document.createElement('canvas');
    canvas.width  = W;
    canvas.height = H;
    const ctx = canvas.getContext('2d');

    ctx.drawImage(tmpl, 0, 0, W, H);

    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';

    // Name — Alex Brush, Title Cased, auto-shrink if it would overflow the line
    const name = titleCase(entry.name) || 'Participant';
    const maxWidth = W * NAME_MAX_FRAC;
    let fontSize = Math.round(H * NAME_SIZE_FRAC);
    ctx.font = fontSize + 'px "Alex Brush"';
    while (ctx.measureText(name).width > maxWidth && fontSize > 40) {
      fontSize -= 4;
      ctx.font = fontSize + 'px "Alex Brush"';
    }
    ctx.fillStyle = NAME_COLOR;
    ctx.fillText(name, W * NAME_CX_FRAC, H * NAME_CY_FRAC);

    // Download as PNG
    canvas.toBlob(function (blob) {
      const url = URL.createObjectURL(blob);
      const a   = document.createElement('a');
      const safe = (entry.name || 'certificate').replace(/[^a-z0-9]+/gi, '_');
      a.href     = url;
      a.download = 'Srestha_Certificate_' + safe + '.png';
      a.click();
      URL.revokeObjectURL(url);
    }, 'image/png');
  } finally {
    if (btn) { btn.textContent = 'Download Certificate'; btn.disabled = false; }
  }
}
</script>
<script>
// Page title: plain words rise letter by letter, shimmer words rise whole
(function () {
  document.querySelectorAll('.page-title').forEach(function (el) {
    var i = 0;
    el.setAttribute('aria-label', el.innerHTML.replace(/<br\s*\/?>/gi, ' ').replace(/<[^>]+>/g, '').replace(/&amp;/g, '&').replace(/\s+/g, ' ').trim());
    (function walk(node, whole) {
      Array.prototype.slice.call(node.childNodes).forEach(function (n) {
        if (n.nodeType === 3) {
          var frag = document.createDocumentFragment();
          n.textContent.split(/(\s+)/).forEach(function (part) {
            if (!part) return;
            if (/^\s+$/.test(part)) { frag.appendChild(document.createTextNode(' ')); return; }
            var w = document.createElement('span');
            w.className = 'w';
            w.setAttribute('aria-hidden', 'true');
            (whole ? [part] : Array.from(part)).forEach(function (piece) {
              var c = document.createElement('span');
              c.textContent = piece;
              c.style.setProperty('--i', i);
              i += whole ? 3 : 1;
              w.appendChild(c);
            });
            frag.appendChild(w);
          });
          n.parentNode.replaceChild(frag, n);
        } else if (n.nodeType === 1 && n.tagName !== 'BR') {
          var isShimmer = n.classList.contains('shimmer');
          if (isShimmer) n.classList.add('shimmer-split');
          walk(n, whole || isShimmer);
        }
      });
    })(el, false);
    el.classList.add('split');
    function show() { el.classList.add('is-in'); }
    requestAnimationFrame(function () { requestAnimationFrame(show); });
    setTimeout(show, 200);
  });
})();
</script>
